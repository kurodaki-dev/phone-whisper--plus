name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash --noprofile --norc {0}
        run: |
          LOG="/tmp/sdk-setup.log"
          : > "$LOG"

          {
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "Using SDK_ROOT=$SDK_ROOT"
            echo "--- contents of \$SDK_ROOT/cmdline-tools (if any) ---"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 2>&1

            SDKMANAGER=""
            if [ -d "$SDK_ROOT/cmdline-tools" ]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -iname sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
            fi

            if [ -z "$SDKMANAGER" ]; then
              echo "No existing sdkmanager found, downloading fresh cmdline-tools..."
              mkdir -p "$SDK_ROOT/cmdline-tools"
              curl -fsSL -o /tmp/cmdline-tools.zip \
                "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
              echo "curl exit code: $?"
              unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extracted
              echo "unzip exit code: $?"
              rm -rf "$SDK_ROOT/cmdline-tools/latest"
              mv /tmp/cmdline-tools-extracted/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi

            echo "Using sdkmanager at: $SDKMANAGER"
            ls -la "$SDKMANAGER"
            chmod +x "$SDKMANAGER"

            echo "--- sdkmanager --version ---"
            "$SDKMANAGER" --version
            echo "version check exit code: $?"

            echo "--- accepting licenses ---"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
            echo "Licenses step exit code: $?"

            echo "--- installing packages ---"
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            echo "Package install exit code: $?"

            echo "$SDK_ROOT" > /tmp/sdk-root.txt
          } > "$LOG" 2>&1
          STEP_EXIT=$?

          cat "$LOG"

          {
            echo "## Android SDK setup log"
            echo '```'
            cat "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          SDK_ROOT="$(cat /tmp/sdk-root.txt 2>/dev/null || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          exit "$STEP_EXIT"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        shell: bash --noprofile --norc {0}
        run: |
          echo "=== diagnostic marker: step started ===" >> "$GITHUB_STEP_SUMMARY"
          echo "pwd: $(pwd)" >> "$GITHUB_STEP_SUMMARY"
          ls -la gradlew >> "$GITHUB_STEP_SUMMARY" 2>&1

          ./gradlew testDebugUnitTest --stacktrace > /tmp/test.log 2>&1
          EXIT=$?
          echo "=== gradlew exit code: $EXIT ===" >> "$GITHUB_STEP_SUMMARY"
          echo "=== log file size: $(wc -c < /tmp/test.log 2>/dev/null || echo missing) bytes ===" >> "$GITHUB_STEP_SUMMARY"

          cat /tmp/test.log

          {
            echo "## Unit test log (tail, exit=$EXIT)"
            echo '```'
            tail -c 60000 /tmp/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$EXIT"

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          if-no-files-found: ignore

      - name: Post test log as commit comment on failure
        if: failure()
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_FILE=/tmp/comment-body.txt
          {
            echo "### CI: unit test failure log (tail)"
            echo '```'
            tail -c 60000 /tmp/test.log
            echo '```'
          } > "$BODY_FILE"
          jq -Rs '{body: .}' "$BODY_FILE" > /tmp/comment-payload.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/comment-payload.json || echo "Failed to post commit comment (exit $?)"

      - name: Build debug APK
        shell: bash --noprofile --norc {0}
        run: |
          ./gradlew assembleDebug --stacktrace > /tmp/build.log 2>&1
          EXIT=$?
          tail -c 60000 /tmp/build.log
          if [ "$EXIT" -ne 0 ]; then
            {
              echo "## Build failure log (tail)"
              echo '```'
              tail -c 60000 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$EXIT"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Post build log as commit comment on failure
        if: failure()
        shell: bash --noprofile --norc {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_FILE=/tmp/comment-body.txt
          {
            echo "### CI: build failure log (tail)"
            echo '```'
            tail -c 60000 /tmp/build.log
            echo '```'
          } > "$BODY_FILE"
          jq -Rs '{body: .}' "$BODY_FILE" > /tmp/comment-payload.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input /tmp/comment-payload.json || echo "Failed to post commit comment (exit $?)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-whisper-plus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
