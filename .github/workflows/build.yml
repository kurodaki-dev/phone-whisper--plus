name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set" >&2
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -iname sdkmanager -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager found under $SDK_ROOT/cmdline-tools, downloading cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager at: $SDKMANAGER"
          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-whisper-plus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
